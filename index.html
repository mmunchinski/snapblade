<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snapblade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: drafting-table tool. Top bar, live canvas, inspector rail on the right (drops below on phones). */
:root {
  --paper: #eef1ef;
  --panel: #fbfcfb;
  --ink: #1c272c;
  --ink-2: #56666c;
  --ink-3: #8a989c;
  --line: #d3dbd8;
  --accent: #2756d3;
  --accent-soft: rgba(39, 86, 211, .12);
  --port: #e0662a;
  --edge: #2c3a40;
  --node-bg: #ffffff;
  --node-stroke: #2c3a40;
  --group-bg: rgba(28, 39, 44, .035);
  --group-stroke: #a3b2b6;
  --grid-dot: #c2ccc9;
  --p-slate: #5b6b73; --p-blue: #3a63c4; --p-teal: #1d8585; --p-green: #2f8a55; --p-amber: #b47a17; --p-orange: #c8602a; --p-red: #c2463b; --p-violet: #7a4fc4;
  --danger: #b8392e;
  --ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14191b; --panel: #1a2023; --ink: #e2e9ea; --ink-2: #9aa9ad; --ink-3: #6c7b80;
    --line: #2c353a; --accent: #7397ff; --accent-soft: rgba(115, 151, 255, .16); --port: #ff8b4f;
    --edge: #c4cfd2; --node-bg: #1f272a; --node-stroke: #b9c5c8; --group-bg: rgba(255, 255, 255, .03);
    --group-stroke: #4b5a5f; --grid-dot: #2a3337;
    --p-slate: #9aabb2; --p-blue: #7f9ef0; --p-teal: #5cc6c6; --p-green: #5cc08a; --p-amber: #e0aa4d; --p-orange: #f0905c; --p-red: #ee7b70; --p-violet: #b195f0; --danger: #ff7d70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14191b; --panel: #1a2023; --ink: #e2e9ea; --ink-2: #9aa9ad; --ink-3: #6c7b80;
  --line: #2c353a; --accent: #7397ff; --accent-soft: rgba(115, 151, 255, .16); --port: #ff8b4f;
  --edge: #c4cfd2; --node-bg: #1f272a; --node-stroke: #b9c5c8; --group-bg: rgba(255, 255, 255, .03);
  --group-stroke: #4b5a5f; --grid-dot: #2a3337;
  --p-slate: #9aabb2; --p-blue: #7f9ef0; --p-teal: #5cc6c6; --p-green: #5cc08a; --p-amber: #e0aa4d; --p-orange: #f0905c; --p-red: #ee7b70; --p-violet: #b195f0; --danger: #ff7d70;
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- top bar ---------- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand svg { width: 26px; height: 26px; }
.brand .tag { font: 500 11px var(--mono); color: var(--ink-3); letter-spacing: .02em; font-weight: 400; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 5px 11px; font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--danger); }
.sep { width: 1px; background: var(--line); margin: 2px 4px; }
.modes { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.modes > span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 600; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; background: var(--paper); flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; border-radius: 5px; padding: 4px 10px;
  font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.06); }
.modes .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: none; }

/* ---------- main ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
#cv.panning { cursor: grabbing; }

.status {
  position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 180px);
  font: 12px var(--mono); color: var(--ink-2); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px;
  font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; }
.zoom button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; font: 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.zoom button:hover { color: var(--ink); background: var(--paper); }
.zoom #zlbl { min-width: 52px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }

#editor {
  position: absolute; z-index: 5; resize: none; border: 2px solid var(--accent); border-radius: 4px;
  background: var(--node-bg); color: var(--ink); text-align: center; padding: 4px 8px;
  font: 500 13px/1.25 var(--ui); outline: none;
}

/* ---------- inspector ---------- */
.panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.panel section { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.panel h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.panel p { margin: 0; }
.desc { color: var(--ink-2); font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-2); }
.field > span { font-weight: 500; }
.field textarea, .field select, .num input {
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 6px 8px; font-size: 13px; color: var(--ink); width: 100%;
}
.field textarea { resize: vertical; min-height: 54px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.num { display: flex; flex-direction: column; gap: 3px; font: 11px var(--mono); color: var(--ink-3); }
.num input { font: 12px var(--mono); padding: 5px 6px; font-variant-numeric: tabular-nums; }
.num input:disabled { opacity: .5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatches { display: flex; gap: 5px; flex-wrap: wrap; }
.sw { width: 24px; height: 22px; border-radius: 5px; cursor: pointer; border: 1.5px solid var(--swl); background: var(--swf); padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.colorrow { display: grid; grid-template-columns: 34px minmax(0, 1.7fr) repeat(3, minmax(0, 1fr)); gap: 6px; align-items: end; }
.colorrow input[type=color] { width: 34px; height: 29px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); cursor: pointer; }
.colorrow .num input { text-transform: uppercase; padding-inline: 5px; -moz-appearance: textfield; appearance: textfield; }
.colorrow .num input::-webkit-inner-spin-button, .colorrow .num input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.meta { font: 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ports { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.ports div { border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; text-align: center; font: 11px var(--mono); color: var(--ink-3); }
.ports b { display: block; font: 600 15px var(--mono); color: var(--ink); }
.ports .hot b { color: var(--port); }
ol.try { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--ink); }
ol.try li::marker { color: var(--ink-3); font: 12px var(--mono); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; }
input[type=range] { accent-color: var(--accent); width: 100%; }
dl.keys { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px; }
dl.keys dt { font: 11.5px var(--mono); color: var(--ink-2); white-space: nowrap; }
dl.keys dd { margin: 0; }
.ends { font-size: 13px; }
.ends b { font-weight: 600; }
.mode-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); }
.mode-card strong { font-size: 14px; }

/* ---------- canvas (SVG) ---------- */
.gdot { fill: var(--grid-dot); }
/* Each shape/connector may set --ln (line), --fl (fill) and --dash on its group; otherwise theme defaults apply. */
.b-body { fill: var(--fl, var(--node-bg)); stroke: var(--ln, var(--node-stroke)); stroke-dasharray: var(--dash, none); stroke-width: 1.5; }
.node { cursor: move; }
.node.sel .b-body, .node.sel .g-body { stroke: var(--accent); stroke-width: 2; }
.node.target .b-body, .node.target .g-body { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); }
.node.lifted { filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); }
.g-body { fill: var(--fl, var(--group-bg)); stroke: var(--ln, var(--group-stroke)); stroke-dasharray: var(--dash, none); stroke-width: 1.25; }
.g-rule { stroke: var(--ln, var(--group-stroke)); stroke-width: 1; opacity: .55; }
.group.drop .g-body { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; fill: var(--accent-soft); }
.g-label { font: 600 11.5px var(--ui); fill: var(--ln, var(--ink-2)); letter-spacing: .07em; text-transform: uppercase; }
.g-meta { font: 10px var(--mono); fill: var(--ink-3); }
.lblwrap { pointer-events: none; overflow: visible; }
.lbl {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
  font: 500 13px/1.25 var(--ui); color: var(--ink); padding: 4px 8px; white-space: pre-wrap; overflow: hidden; word-break: break-word;
}
.edge { cursor: pointer; }
.edge .hit { fill: none; stroke: transparent; stroke-width: 12; }
.edge .line { fill: none; stroke: var(--ln, var(--edge)); stroke-dasharray: var(--dash, none); stroke-width: 1.5; stroke-linejoin: round; }
.edge:hover .line { stroke: var(--accent); }
.edge.sel .line { stroke: var(--accent); stroke-width: 2; }
.edge.ghosted { opacity: .25; }
.elabel-bg { fill: var(--paper); }
.elabel-t { font: 500 12px var(--ui); fill: var(--ink-2); text-anchor: middle; dominant-baseline: central; }
.edge.sel .elabel-t, .edge:hover .elabel-t { fill: var(--accent); }
.ahead { fill: var(--edge); }
.ahead.sel { fill: var(--accent); }
.slot { fill: var(--port); }
.slot-x { stroke: var(--port); stroke-width: 1.6; fill: none; }
.rh { fill: var(--panel); stroke: var(--accent); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.conn circle { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: crosshair; }
.conn:hover circle { fill: var(--accent); }
.conn path { stroke: var(--accent); stroke-width: 1.4; vector-effect: non-scaling-stroke; pointer-events: none; fill: none; }
.conn:hover path { stroke: var(--panel); }
.eh { fill: var(--accent); stroke: var(--panel); stroke-width: 2; vector-effect: non-scaling-stroke; cursor: grab; }
.marquee { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.node.primary .b-body, .node.primary .g-body { stroke-width: 3; }
.temp { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.cur-nw, .cur-se { cursor: nwse-resize; } .cur-ne, .cur-sw { cursor: nesw-resize; }
.cur-n, .cur-s { cursor: ns-resize; } .cur-e, .cur-w { cursor: ew-resize; }

/* ---------- title block and legend ---------- */
.ann { cursor: move; }
.ann-frame { fill: var(--node-bg); stroke: var(--node-stroke); stroke-width: 1.25; }
.ann.sel .ann-frame { stroke: var(--accent); stroke-width: 2; }
.ann-rule { stroke: var(--node-stroke); stroke-width: 1; opacity: .45; }
.ann-title { font: 600 15px var(--ui); fill: var(--ink); }
.ann-label { font: 600 9.5px var(--ui); fill: var(--ink-3); letter-spacing: .06em; }
.ann-value { font: 500 12.5px var(--ui); fill: var(--ink); }
.ann-heading { font: 600 11px var(--ui); fill: var(--ink-2); letter-spacing: .08em; }
.ann-row { font: 500 12.5px var(--ui); fill: var(--ink); }
.ann-empty { font: 500 12px var(--ui); fill: var(--ink-3); }
.ann-ghost { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 5 4; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.sw-line { stroke: var(--ln, var(--edge)); stroke-width: 1.5; stroke-dasharray: var(--dash, none); fill: none; }
.sw-head { fill: var(--ln, var(--edge)); }
.field input[type=text] { border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 6px 8px; font-size: 13px; color: var(--ink); width: 100%; min-width: 0; }
.inline { display: flex; gap: 6px; align-items: end; }
.inline .field { flex: 1; min-width: 0; }
.corners { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.corners button { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 7px 9px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.corners button[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.cicon { width: 18px; height: 13px; border: 1.5px solid currentColor; border-radius: 2px; position: relative; flex: none; }
.cicon::after { content: ''; position: absolute; width: 6px; height: 4px; background: var(--accent); }
.cicon.top-left::after { top: 1px; left: 1px; } .cicon.top-right::after { top: 1px; right: 1px; }
.cicon.bottom-left::after { bottom: 1px; left: 1px; } .cicon.bottom-right::after { bottom: 1px; right: 1px; }
.legrows { display: flex; flex-direction: column; gap: 6px; }
.legrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.legrow svg { width: 34px; height: 20px; overflow: visible; }
.legrow.off svg, .legrow.off input { opacity: .4; }
.legrow input { border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 5px 7px; font-size: 13px; color: var(--ink); min-width: 0; }
.mini { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 3px 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.togglerow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ---------- document name, file menu, dialogs, toasts ---------- */
.doc { display: flex; align-items: center; gap: 4px; min-width: 0; }
.docname { border: 1px solid transparent; background: transparent; font: 500 14px var(--ui); color: var(--ink); padding: 4px 6px; border-radius: 6px; max-width: 28ch; text-overflow: ellipsis; }
.docname:hover { border-color: var(--line); }
.docname:focus { border-color: var(--accent); outline: none; background: var(--paper); }
.dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--port); flex: none; }
.menu-wrap { position: relative; }
.menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; min-width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, .16); padding: 4px; display: flex; flex-direction: column; }
.menu button { display: flex; justify-content: space-between; align-items: center; gap: 18px; border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 5px; font-size: 13px; cursor: pointer; color: var(--ink); }
.menu button:hover, .menu button:focus-visible { background: var(--paper); outline: none; }
.menu kbd { font: 11px var(--mono); color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 16, .45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .3); width: min(820px, 100%); max-height: calc(100% - 8px); overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.modal.small { width: min(440px, 100%); }
.modal h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.modal p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.export-grid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; }
.export-preview { background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0 / 16px 16px; border: 1px solid var(--line); border-radius: 8px; min-height: 280px; display: flex; align-items: center; justify-content: center; padding: 14px; min-width: 0; }
.export-preview img { max-width: 100%; max-height: 380px; box-shadow: 0 1px 6px rgba(0, 0, 0, .18); }
.export-opts { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.export-opts .seg button:disabled { opacity: .4; cursor: default; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 54px; z-index: 30; max-width: calc(100% - 32px); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); }
.toast.err { background: var(--danger); color: #fff; }
.empty-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; color: var(--ink-3); font-size: 14px; text-align: center; padding: 16px; }
.stage.dropping::after { content: 'Drop a .snapblade file to open it'; position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--accent); pointer-events: none; }

@media (max-width: 760px) {
  .export-grid { grid-template-columns: minmax(0, 1fr); }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .panel { border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; }
  .modes { margin-left: 0; }
  .status { max-width: calc(100% - 160px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true">
        <path d="M2 17.5 L7 8.5 H24 V17.5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M11 17.5 L14 8.5 M16 17.5 L19 8.5" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
        <path d="M2 17.5 L7 8.5 H9.5 L6.5 17.5 Z" fill="var(--port)"/>
      </svg>
      Snapblade <span class="tag">playground &middot; build 20</span>
    </div>
    <div class="doc">
      <input id="docName" class="docname" value="Untitled diagram" aria-label="Diagram name" spellcheck="false" autocomplete="off">
      <span id="dirtyDot" class="dirty" title="Not saved to a file yet" role="img" aria-label="Unsaved changes" hidden></span>
    </div>
    <div class="tools">
      <div class="menu-wrap">
        <button class="btn" id="fileBtn" type="button" aria-haspopup="menu" aria-expanded="false">File &#9662;</button>
        <div class="menu" id="fileMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-file="new">New diagram</button>

<script>
'use strict';
/* =====================================================================

      B('cache', 'Redis cache', 0, 0, 160, 90, { parent: 'data', style: { line: 'amber' } }),
      B('idb', 'Inventory DB', 0, 0, 160, 50, { parent: 'data', style: { line: 'green' } }),
      B('gw', 'Payment gateway\n(external)', 820, 480, 160, 60, { style: { dash: 'dashed', fill: 'none' } }),

      { ...E('e1', 'users', 'waf'), label: 'HTTPS' }, E('e2', 'waf', 'lb'),
      { ...E('e3', 'lb', 'orders'), label: '/orders' }, { ...E('e4', 'lb', 'inv'), label: '/stock' }, { ...E('e5', 'lb', 'pay'), label: '/pay' },
      { ...E('e6', 'orders', 'odb'), label: 'SQL' }, E('e7', 'orders', 'cache'),
      E('e8', 'inv', 'cache'), { ...E('e9', 'inv', 'idb'), label: 'SQL' },

}

/* ---------- colors and line styles ----------
   style.line: null (theme default) | preset name (adapts to light/dark) | '#rrggbb'
   style.fill: 'pair' (a tint of the line color, the default) | 'none' | '#rrggbb'
   style.tint: strength of the paired tint in %; style.dash: 'solid' | 'dashed' | 'dotted' */
const PRESETS = ['slate', 'blue', 'teal', 'green', 'amber', 'orange', 'red', 'violet'];
const DASH = { solid: 'none', dashed: '6 4', dotted: '1.5 3.5' };
const isHex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
const lineCss = (v, fallback) => !v ? fallback : isHex(v) ? v : `var(--p-${v})`;
const defLineCss = o => !o.kind ? 'var(--edge)' : o.kind === 'group' ? 'var(--group-stroke)' : 'var(--node-stroke)';
const tintOf = o => o.style?.tint ?? (o.kind === 'group' ? 7 : 16);
function styleVars(o) {
  const st = o.style || {}, out = [];
  const ln = lineCss(st.line, defLineCss(o));
  if (st.line) out.push(`--ln:${ln}`);
  if (o.kind) {

    if (fill === 'none') out.push('--fl:transparent');

    else if (st.line) out.push(`--fl:color-mix(in srgb, ${ln} ${tintOf(o)}%, ${base})`);

}
// Older saves used a named color per box.
function migrateStyle(n) {
  if (!('color' in n)) return;
  const c = n.color; delete n.color;
  if (c === 'ghost') n.style = { dash: 'dashed', fill: 'none' };
  else if (c && c !== 'plain') n.style = { line: c, fill: 'pair' };

/* ---------- title block and legend ----------
   Diagram-level blocks placed just outside the diagram in a chosen corner.
   The legend builds itself from the styles in use; you supply what each one means. */
const LEGEND_HINT = 'Color a shape or connector to add a row.';
const CORNERS = [['top-left', 'Top left'], ['top-right', 'Top right'], ['bottom-left', 'Bottom left'], ['bottom-right', 'Bottom right']];
const ANN = { margin: 28, gap: 16, pad: 12 };
const titleDefaults = () => ({ show: false, title: '', version: '', date: '', author: '', pos: 'bottom-right' });
const legendDefaults = () => ({ show: false, heading: 'Legend', pos: 'bottom-left', labels: {}, hidden: [] });
const kindWord = o => !o.kind ? 'connector' : o.kind === 'group' ? 'container' : 'box';
// Identifies a visual style: same key, same legend row.
function styleKey(o) {
  const st = o.style || {}, parts = [st.line || '', st.dash && st.dash !== 'solid' ? st.dash : ''];
  if (o.kind) { const f = st.fill || 'pair'; parts.push(f === 'pair' ? (st.line ? 'pair' + (st.tint ?? '') : '') : f); }

}
const isStyled = o => styleKey(o).split(':')[1].replace(/\|/g, '') !== '';
// A readable default name for a style, e.g. "Green box", "Dashed connector", "Box, no fill".
function autoName(o) {

  if (st.line) words.push(isHex(st.line) ? st.line.toUpperCase() : st.line);

}
// One entry per distinct style in use (boxes, then containers, then connectors), in order of first use.
function legendEntries() {

  for (const o of [...S.nodes.filter(n => n.kind === 'box'), ...S.nodes.filter(n => n.kind === 'group'), ...S.edges]) {
    if (!isStyled(o)) continue;
    const key = styleKey(o);

}
const legendRows = () => legendEntries().filter(e => !S.legend.hidden.includes(e.key)).map(e => ({ ...e, label: (S.legend.labels[e.key] || '').trim() || e.auto }));

// Size and place the visible blocks around the content bounds B {x1,y1,x2,y2}.
// fam: font family used to measure text (the export may use a different font).
// emptyHint: text shown in a legend with no rows (on the canvas); without it, an empty legend is left out.
function annotationLayout(B, fam, docName, emptyHint) {
  const m = (t, w, px) => textWidth(t, `${w} ${px}px ${fam}`), blocks = [];

    const w = Math.ceil(Math.max(170, m(heading, 600, 11) + 30, rows.length ? 0 : m(emptyHint, 500, 12) + 2 * ANN.pad,
      ...rows.map(r => m(r.label, 500, 12.5) + 30 + 12 + 2 * ANN.pad)));
    blocks.push({ id: 'legend', pos: S.legend.pos, w, h: 2 * ANN.pad + 16 + 6 + Math.max(1, rows.length) * 22 - 4, heading, rows });
  }

    const t = S.title, title = (t.title || '').trim() || docName || 'Untitled diagram';
    const cells = [['Version', t.version], ['Date', t.date], ['Author', t.author]].map(([l, v]) => [l, (v || '').trim()]).filter(c => c[1]);
    const cw = cells.map(([l, v]) => Math.ceil(Math.max(m(l.toUpperCase(), 600, 9.5) * 1.08, m(v, 500, 12.5))) + 24);
    const w = Math.ceil(Math.max(220, m(title, 600, 15) + 28, cw.reduce((a, b) => a + b, 0)));
    blocks.push({ id: 'title', pos: t.pos, w, h: 40 + (cells.length ? 40 : 0), title, cells, cw });

    for (const q of placed) {
      if (q.pos.startsWith('top') !== top || b.x >= q.x + q.w || q.x >= b.x + b.w) continue;
      b.y = top ? Math.min(b.y, q.y - ANN.gap - b.h) : Math.max(b.y, q.y + q.h + ANN.gap);

}
// Draw blocks. `p` supplies how things are painted: CSS classes on the canvas, plain colors in exports.
function annotationMarkup(blocks, p) {
  let out = '';

    out += `<g ${p.group(b.id)}><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="4" ${p.frame()}/>`;
    if (b.id === 'title') {
      out += `<text x="${b.x + 14}" y="${b.y + 25}" ${p.text('title')}>${esc(b.title)}</text>`;
      if (b.cells.length) {
        out += `<line x1="${b.x}" y1="${b.y + 40}" x2="${b.x + b.w}" y2="${b.y + 40}" ${p.rule()}/>`;
        const extra = (b.w - b.cw.reduce((a, c) => a + c, 0)) / b.cells.length;
        let cx = b.x;
        b.cells.forEach(([label, value], i) => {
          if (i) out += `<line x1="${cx}" y1="${b.y + 40}" x2="${cx}" y2="${b.y + b.h}" ${p.rule()}/>`;
          out += `<text x="${cx + 12}" y="${b.y + 55}" ${p.text('label')}>${esc(label.toUpperCase())}</text>`
            + `<text x="${cx + 12}" y="${b.y + 71}" ${p.text('value')}>${esc(value)}</text>`;
          cx += b.cw[i] + extra;
        });
      }
    } else {
      out += `<text x="${b.x + ANN.pad}" y="${b.y + ANN.pad + 11}" ${p.text('heading')}>${esc(b.heading)}</text>`;
      if (!b.rows.length) out += p.empty ? `<text x="${b.x + ANN.pad}" y="${b.y + ANN.pad + 16 + 6 + 14}" ${p.text('empty')}>${p.empty}</text>` : '';
      b.rows.forEach((r, i) => {
        const ry = b.y + ANN.pad + 16 + 6 + i * 22;
        out += p.swatch(r.sample, b.x + ANN.pad, ry + 1, 30, 16)
          + `<text x="${b.x + ANN.pad + 42}" y="${ry + 13.5}" ${p.text('row')}>${esc(r.label)}</text>`;
      });

  }

}
// Swatch geometry shared by the canvas, the panel and exports. `c` gives line/fill attributes.
function swatchShape(o, x, y, w, h, c) {
  if (o.kind) return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.kind === 'group' ? 3 : 2}" ${c.body}/>`;
  const my = y + h / 2;
  return `<g ${c.group || ''}><line x1="${x}" y1="${my}" x2="${x + w - 6}" y2="${my}" ${c.line}/><path d="M${x + w},${my} L${x + w - 8},${my - 3.6} L${x + w - 8},${my + 3.6} Z" ${c.head}/></g>`;
}
// Canvas/panel painting through the app's CSS.
const canvasSwatch = (o, x, y, w, h) => swatchShape(o, x, y, w, h, {
  body: `class="${o.kind === 'group' ? 'g-body' : 'b-body'}" style="${styleVars(o)}"`,
  group: `style="${styleVars(o)}"`, line: 'class="sw-line"', head: 'class="sw-head"' });

/* ---------- containers ---------- */
function layoutGroup(g) {
  const ch = kidsOf(g.id);
  for (const c of ch) if (c.kind === 'group') layoutGroup(c);
  const pad = g.pad;
  if (g.layout === 'row' || g.layout === 'column') {
    if (!ch.length) { g.w = Math.max(g.w, 160); g.h = Math.max(g.h, 100); return; }
    const row = g.layout === 'row';
    let cross = Math.max(...ch.map(c => row ? c.h : c.w));
    if (!row) cross = Math.max(cross, 140 - 2 * pad);
    let cur = row ? g.x + pad : g.y + HEADER + pad;
    for (const c of ch) {
      const off = g.align === 'center' ? Math.round((cross - (row ? c.h : c.w)) / 2) : 0;
      const tx = row ? cur : g.x + pad + off;
      const ty = row ? g.y + HEADER + pad + off : cur;
      translate(c.id, tx - c.x, ty - c.y);
      cur += (row ? c.w : c.h) + g.gap;
    }
    const along = cur - g.gap - (row ? g.x : g.y) + pad;
    if (row) { g.w = along; g.h = HEADER + 2 * pad + cross; } else { g.w = cross + 2 * pad; g.h = along; }

    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;

    const nx = Math.min(g.x, x1 - pad), ny = Math.min(g.y, y1 - pad - HEADER);
    const nx2 = Math.max(g.x + g.w, x2 + pad), ny2 = Math.max(g.y + g.h, y2 + pad);
    g.x = nx; g.y = ny; g.w = nx2 - nx; g.h = ny2 - ny;
  }
}
function layoutAll() {
  for (let pass = 0; pass < 2; pass++) {
    for (const n of S.nodes) if (n.kind === 'group' && !n.parent) layoutGroup(n);
    const L = lifted && byId(lifted);
    if (L && L.kind === 'group') layoutGroup(L);
  }
}

/* ---------- anchor points ---------- */
function autoSides(a, b) {
  const gx = Math.max(b.x - (a.x + a.w), a.x - (b.x + b.w));

  const ca = center(a), cb = center(b);

}
function resolveSides(e) {
  const [sa, sb] = autoSides(byId(e.from.node), byId(e.to.node));

}

// Spread n anchors along [s0, s1]. Entries with a desired coordinate try to sit there
// (to line up with their partner); the rest fill the gaps evenly. Keeps order and a minimum gap.
function place(desired, s0, s1) {
  const n = desired.length, len = s1 - s0;
  const even = () => desired.map((_, i) => Math.round(s0 + (i + 1) * len / (n + 1)));
  if (desired.every(d => d == null)) return even();
  const m = Math.min(10, len * 0.15), lo = s0 + m, hi = s1 - m;
  const pos = desired.map(d => d == null ? null : Math.min(hi, Math.max(lo, d)));
  for (let i = 0; i < n;) {
    if (pos[i] != null) { i++; continue; }
    let j = i; while (j < n && pos[j] == null) j++;
    const L = i > 0 ? pos[i - 1] : s0, R = j < n ? pos[j] : s1, k = j - i;
    for (let t = 0; t < k; t++) pos[i + t] = L + (t + 1) * (R - L) / (k + 1);
    i = j;
  }
  const g = Math.min(MIN_GAP, len / (n + 1));
  pos[0] = Math.max(pos[0], lo);
  for (let i = 1; i < n; i++) if (pos[i] < pos[i - 1] + g) pos[i] = pos[i - 1] + g;
  if (pos[n - 1] > hi) {
    pos[n - 1] = hi;
    for (let i = n - 2; i >= 0; i--) if (pos[i] > pos[i + 1] - g) pos[i] = pos[i + 1] - g;
  }
  if (pos[0] < lo - 0.5) return even();
  return pos.map(Math.round);
}

function computePorts() {
  const mode = S.settings.mode, ends = [], out = dict();
  S.edges.forEach((e, idx) => {
    const a = byId(e.from.node), b = byId(e.to.node);
    if (!a || !b) return;

    if (mode === 'fixed' && e.fixed) { sa = e.fixed.from.side; sb = e.fixed.to.side; }
    else [sa, sb] = resolveSides(e);

    const eb = { e, idx, which: 'to', node: b, side: sb, pos: null };

  if (mode === 'fixed') {
    for (const en of ends) {

      en.pos = s0 + (f ? f.frac : 0.5) * (s1 - s0);

        line: `stroke="${c.line}" stroke-width="1.5"${d}`, head: `fill="${c.line}"` }); },
  });
  const svgText = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${ox} ${oy} ${W} ${H}" font-family="${family}">`
    + `<title>${esc(doc.name)}</title>`
    + (o.fontCss ? `<defs><style>${o.fontCss}</style></defs>` : '')
    + (bg ? `<rect x="${ox}" y="${oy}" width="${W}" height="${H}" fill="${bg}"/>` : '')
    + out + '</svg>';
  return { svg: svgText, w: W, h: H };
}

async function svgToPng(svgText, w, h, scale) {
  const url = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml' }));
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('Could not render the image.')); img.src = url; });
    await new Promise(r => setTimeout(r, 60));   // let embedded fonts finish decoding before drawing
    const c = document.createElement('canvas');
    c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/png'));
  } finally { URL.revokeObjectURL(url); }
}
const scriptLoads = {};
function loadScript([src, integrity]) {
  return scriptLoads[src] ||= new Promise((res, rej) => {
    const el = document.createElement('script'); el.src = src; el.integrity = integrity; el.crossOrigin = 'anonymous'; el.onload = res;
    el.onerror = () => { delete scriptLoads[src]; rej(new Error('Could not load the PDF library. Check your internet connection.')); };
    document.head.appendChild(el);
  });
}
async function svgToPdf(svgText, w, h, page) {
  for (const lib of PDF_LIBS) await loadScript(lib);
  const { jsPDF } = window.jspdf, pt = 0.75;   // CSS px -> PDF points
  let pw = w * pt, ph = h * pt, margin = 0;
  if (page !== 'fit') { const [a, b] = page === 'letter' ? [792, 612] : [841.89, 595.28]; [pw, ph] = w >= h ? [a, b] : [b, a]; margin = 36; }
  const pdf = new jsPDF({ unit: 'pt', format: [pw, ph], orientation: pw >= ph ? 'landscape' : 'portrait' });
  const s = Math.min((pw - 2 * margin) / (w * pt), (ph - 2 * margin) / (h * pt));
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-100000px;top:0;';
  host.innerHTML = svgText; document.body.appendChild(host);
  try {
    await pdf.svg(host.querySelector('svg'), { x: (pw - w * pt * s) / 2, y: (ph - h * pt * s) / 2, width: w * pt * s, height: h * pt * s });
  } finally { host.remove(); }
  pdf.setProperties({ title: doc.name, creator: 'Snapblade' });
  return pdf.output('blob');
}
// Produce the chosen export as a Blob (for download or the clipboard).
async function exportBlob(opts) {
  const pdf = opts.format === 'pdf';
  const built = buildExportSvg({ ...opts, annots: opts.annots !== 'no', pdf, background: pdf && opts.background === 'none' ? 'white' : opts.background, fontCss: pdf ? '' : await embeddedFontCss() });
  if (!built) throw new Error('There is nothing to export yet.');
  if (opts.format === 'svg') return { blob: new Blob([built.svg], { type: 'image/svg+xml' }), built };
  if (opts.format === 'png') return { blob: await svgToPng(built.svg, built.w, built.h, opts.scale), built };
  return { blob: await svgToPdf(built.svg, built.w, built.h, opts.page), built };
}

function exportDialogHtml() {
  const o = exportOpts, hasSel = selectedIds().length > 0, pdf = o.format === 'pdf';
  const exSeg = (key, opts, cur, disabled = []) => `<div class="seg" role="group">${opts.map(([v, l]) =>
    `<button type="button" data-ex="${key}" data-val="${v}" aria-pressed="${String(v) === String(cur)}"${disabled.includes(v) ? ' disabled' : ''}>${l}</button>`).join('')}</div>`;
  return `
    <h2 id="modalTitle">Export</h2>
    <div class="export-grid">
      <div class="export-preview"><img id="exPreview" alt="Preview of the export"></div>
      <div class="export-opts">
        <div class="field"><span>Format</span>${exSeg('format', [['svg', 'SVG'], ['png', 'PNG'], ['pdf', 'PDF']], o.format)}</div>
        <div class="field"><span>Theme</span>${exSeg('theme', [['light', 'Light'], ['dark', 'Dark']], o.theme)}</div>
        <div class="field"><span>Background</span>${exSeg('background', [['white', 'White'], ['canvas', 'Canvas'], ['none', 'None']], pdf && o.background === 'none' ? 'white' : o.background, pdf ? ['none'] : [])}</div>
        ${o.format === 'png' ? `<div class="field"><span>Size</span>${exSeg('scale', [[1, '1×'], [2, '2×'], [3, '3×']], o.scale)}</div>` : ''}
        ${pdf ? `<div class="field"><span>Page</span>${exSeg('page', [['fit', 'Fit diagram'], ['letter', 'Letter'], ['a4', 'A4']], o.page)}</div>` : ''}
        <div class="field"><span>Include</span>${exSeg('scope', [['all', 'Whole diagram'], ['selection', 'Selection']], hasSel ? o.scope : 'all', hasSel ? [] : ['selection'])}</div>
        ${(S.title.show || S.legend.show) && !(hasSel && o.scope === 'selection') ? `<div class="field"><span>Title block &amp; legend</span>${exSeg('annots', [['yes', 'Include'], ['no', 'Leave out']], o.annots)}</div>` : ''}
        <p class="meta" id="exInfo"></p>
        ${pdf ? '<p class="desc">PDFs keep lines and text sharp at any zoom. Text uses Helvetica, a font every PDF reader has.</p>' : ''}
        ${framed ? '<div class="note">Downloads are blocked inside this preview. Copy to clipboard may still work, or use the app at mmunchinski.github.io/snapblade.</div>' : ''}
      </div>
    </div>
    <div class="actions">
      <button class="btn" type="button" data-choice="cancel">Close</button>
      ${pdf ? '' : '<button class="btn" type="button" data-choice="copy">Copy to clipboard</button>'}
      <button class="btn primary" type="button" data-choice="download">Download</button>
    </div>`;
}
let previewUrl = null;
async function refreshExportPreview(box) {
  const o = { ...exportOpts, scope: selectedIds().length ? exportOpts.scope : 'all' };
  const built = buildExportSvg({ ...o, annots: o.annots !== 'no', pdf: o.format === 'pdf', background: o.format === 'pdf' && o.background === 'none' ? 'white' : o.background, fontCss: o.format === 'pdf' ? '' : await embeddedFontCss() });
  const img = box.querySelector('#exPreview'); if (!img || !built) return;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(new Blob([built.svg], { type: 'image/svg+xml' }));
  img.src = previewUrl;
  const info = box.querySelector('#exInfo');
  const size = o.format === 'png' ? `${Math.round(built.w * o.scale)} × ${Math.round(built.h * o.scale)} px` : `${built.w} × ${built.h}`;
  info.textContent = `${fileBase()}.${o.format}  ·  ${size}`;
}
async function openExport() {
  if (!S.nodes.length) { toast('There is nothing to export yet.', true); return; }
  if (!selectedIds().length) exportOpts.scope = 'all';
  const choice = await ask(exportDialogHtml(), '', refreshExportPreview);
  if (choice !== 'download' && choice !== 'copy') return;
  const o = { ...exportOpts, scope: selectedIds().length ? exportOpts.scope : 'all' }, name = `${fileBase()}.${o.format}`;
  try {
    if (choice === 'copy') await copyExport(o);
    else { const { blob } = await exportBlob(o); download(blob, name); toast(`Exported ${name}`); }
  } catch (e) { toast(e.message || 'Export failed.', true); }
}
// An option in the export dialog was clicked: update and redraw the dialog in place.
function exportOption(b) {
  if (b.disabled) return;
  exportOpts[b.dataset.ex] = b.dataset.ex === 'scale' ? +b.dataset.val : b.dataset.val;
  const box = document.getElementById('modal').firstElementChild;
  box.innerHTML = exportDialogHtml(); refreshExportPreview(box);
}
async function copyExport(o) {
  if (o.format === 'svg') {
    const built = buildExportSvg({ ...o, annots: o.annots !== 'no', pdf: false, fontCss: await embeddedFontCss() });
    await navigator.clipboard.writeText(built.svg); toast('SVG copied to the clipboard');
  } else {
    // Hand the clipboard a promise so the copy still counts as part of the click.
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': exportBlob(o).then(r => r.blob) })]);
    toast('Image copied. Paste it into Slack, PowerPoint, Confluence…');
  }
}

function init() {
  svg = document.getElementById('cv'); stage = document.getElementById('stage'); panel = document.getElementById('panel');
  statusEl = document.getElementById('status'); editor = document.getElementById('editor');
  S = load() || sample();
  try { doc = { ...doc, ...JSON.parse(localStorage.getItem(META_KEY)) }; } catch (e) { /* keep defaults */ }
  // First draw. A saved diagram that can't be drawn must not lock the app: set it aside and start from the sample.
  try { layoutAll(); fit(); render(); }
  catch (e) {
    setAside(); S = sample(); doc = { name: 'Untitled diagram', dirty: false }; layoutAll(); fit();
    toast("The diagram saved in this browser couldn't be drawn. It was set aside, and the sample loaded instead.", true);
  }
  syncModeButtons(); renderPanel(); updateDocUi();

  // Files and export
  const docName = document.getElementById('docName');
  docName.addEventListener('input', () => { fitDocName(docName); doc.name = docName.value.trim() || 'Untitled diagram'; updateDocUi(); save(false); });
  docName.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === 'Escape') { ev.preventDefault(); docName.blur(); } });
  docName.addEventListener('blur', () => { docName.value = doc.name; });
  document.getElementById('fileBtn').addEventListener('click', ev => { ev.stopPropagation(); toggleMenu(); });
  document.getElementById('fileMenu').addEventListener('click', ev => { const b = ev.target.closest('[data-file]'); if (b) fileCommand(b.dataset.file); });
  document.addEventListener('click', ev => { if (!ev.target.closest('.menu-wrap')) closeMenu(); });
  document.getElementById('exportBtn').addEventListener('click', openExport);
  const fileInput = document.getElementById('fileInput');
  fileInput.addEventListener('change', async () => { const f = fileInput.files[0]; fileInput.value = ''; if (f) loadDiagram(await f.text(), f.name, null); });
  const modal = document.getElementById('modal');
  modal.addEventListener('click', ev => {
    if (ev.target === modal) return closeModal('cancel');
    const ex = ev.target.closest('[data-ex]'); if (ex) return exportOption(ex);
    const b = ev.target.closest('[data-choice]'); if (b) closeModal(b.dataset.choice);
  });
  // Drop a .snapblade file anywhere on the canvas to open it.
  stage.addEventListener('dragover', ev => { if ([...ev.dataTransfer.types].includes('Files')) { ev.preventDefault(); stage.classList.add('dropping'); } });
  stage.addEventListener('dragleave', ev => { if (ev.target === stage || !stage.contains(ev.relatedTarget)) stage.classList.remove('dropping'); });
  stage.addEventListener('drop', async ev => {
    ev.preventDefault(); stage.classList.remove('dropping');
    const f = ev.dataTransfer.files[0]; if (!f) return;
    const text = await f.text();
    if (await confirmDiscard()) loadDiagram(text, f.name, null);
  });

  svg.addEventListener('pointerdown', onDown);
  svg.addEventListener('contextmenu', ev => ev.preventDefault());   // right button is for panning
  // A press anywhere else (the side panel, the toolbar) breaks a double-click sequence.
  window.addEventListener('pointerdown', ev => { if (!svg.contains(ev.target)) lastPress = { t: 0, x: 0, y: 0 }; }, true);
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  svg.addEventListener('pointercancel', onCancel);
  svg.addEventListener('pointerleave', () => { if (!drag && hover) { hover = null; render(); } });

  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect(), unit = ev.deltaMode === 1 ? 16 : 1;
    if (ev.shiftKey) {
      // Shift+wheel pans sideways
      view.x -= (ev.deltaY || ev.deltaX) * unit;
      render(); return;
    }
    // Wheel zooms toward the cursor. Trackpad pinch arrives as ctrl+wheel with small deltas, so it gets a stronger factor.
    const dy = Math.max(-100, Math.min(100, ev.deltaY * unit));
    zoomAt(Math.exp(-dy * (ev.ctrlKey ? 0.01 : 0.0025)), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });

  editor.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commitEditor(); }
    if (ev.key === 'Escape') { ev.preventDefault(); commitEditor(true); }
  });
  editor.addEventListener('blur', () => commitEditor());

  panel.addEventListener('input', ev => onField(ev.target));
  panel.addEventListener('focusout', () => { fieldUndo = false; });
  panel.addEventListener('click', ev => { const b = ev.target.closest('[data-act]'); if (b) onAct(b); });

  document.getElementById('modeSeg').addEventListener('click', ev => { const b = ev.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });
  document.getElementById('addBox').addEventListener('click', () => addNode('box'));
  document.getElementById('addGroup').addEventListener('click', () => addNode('group'));
  document.getElementById('undoBtn').addEventListener('click', () => restore(undoStack, redoStack));
  document.getElementById('redoBtn').addEventListener('click', () => restore(redoStack, undoStack));
  document.getElementById('fitBtn').addEventListener('click', fit);
  const zc = f => { const r = svg.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); };
  document.getElementById('zin').addEventListener('click', () => zc(1.2));
  document.getElementById('zout').addEventListener('click', () => zc(1 / 1.2));
  document.getElementById('zlbl').addEventListener('click', () => zc(1 / view.k));

  window.addEventListener('keydown', ev => {
    const mod = ev.ctrlKey || ev.metaKey, k = ev.key;
    if (!document.getElementById('modal').hidden) { if (k === 'Escape') { ev.preventDefault(); closeModal('cancel'); } return; }
    if (k === 'Escape' && !document.getElementById('fileMenu').hidden) { closeMenu(); document.getElementById('fileBtn').focus(); return; }
    if (mod && k.toLowerCase() === 's') { ev.preventDefault(); if (document.activeElement === editor) commitEditor(); saveFile(ev.shiftKey); return; }
    if (mod && k.toLowerCase() === 'o') { ev.preventDefault(); openFile(); return; }
    if (ev.target.matches?.('input, textarea, select')) return;
    if (mod && k.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? restore(redoStack, undoStack) : restore(undoStack, redoStack); }
    else if (mod && k.toLowerCase() === 'y') { ev.preventDefault(); restore(redoStack, undoStack); }
    else if (mod && ev.shiftKey && k.toLowerCase() === 'c') { ev.preventDefault(); copyStyle(); }
    else if (mod && ev.shiftKey && k.toLowerCase() === 'v') { ev.preventDefault(); pasteStyle(); }
    else if (mod && k.toLowerCase() === 'c') { if (copySel()) ev.preventDefault(); }
    else if (mod && k.toLowerCase() === 'x') { ev.preventDefault(); cutSel(); }
    else if (mod && k.toLowerCase() === 'v') { ev.preventDefault(); paste(); }
    else if (mod && k.toLowerCase() === 'd') { ev.preventDefault(); duplicateSel(); }
    else if (mod && k.toLowerCase() === 'a') { ev.preventDefault(); setMulti(topLevel(S.nodes.map(n => n.id))); render(); }
    else if (k === 'Delete' || k === 'Backspace') { if (sel) { ev.preventDefault(); deleteSel(); } }
    else if (k === 'Escape') { select(null); render(); }
    else if ((k === 'F2' || k === 'Enter') && sel) { ev.preventDefault(); startEditing(); }
    else if (sel && sel.type !== 'annot' && k.length === 1 && k !== ' ' && !mod && !ev.altKey) { ev.preventDefault(); startEditing(k); }
    else if (k === ' ') { spaceDown = true; }
    else if (sel?.type === 'node' && k.startsWith('Arrow')) {
      ev.preventDefault();
      const s = ev.shiftKey ? 1 : S.settings.grid;
      const dx = k === 'ArrowLeft' ? -s : k === 'ArrowRight' ? s : 0, dy = k === 'ArrowUp' ? -s : k === 'ArrowDown' ? s : 0;
      pushUndo(); for (const id of topLevel(selectedIds())) translate(id, dx, dy); refresh(false, true);
    }
  });
  window.addEventListener('keyup', ev => { if (ev.key === ' ') spaceDown = false; });
  new ResizeObserver(() => render()).observe(stage);
  document.fonts?.ready.then(() => render());
}

if (typeof document !== 'undefined' && document.getElementById('cv')) init();
</script>
