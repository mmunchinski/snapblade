<style>
/* Layout: drafting-table tool. Top bar, live canvas, inspector rail on the right (drops below on phones). */
:root {
  --paper: #eef1ef;
  --panel: #fbfcfb;
  --ink: #1c272c;
  --ink-2: #56666c;
  --ink-3: #8a989c;
  --line: #d3dbd8;
  --accent: #2756d3;
  --accent-soft: rgba(39, 86, 211, .12);
  --port: #e0662a;
  --edge: #2c3a40;
  --node-bg: #ffffff;
  --node-stroke: #2c3a40;
  --group-bg: rgba(28, 39, 44, .035);
  --group-stroke: #a3b2b6;
  --grid-dot: #c2ccc9;
  --p-slate: #5b6b73; --p-blue: #3a63c4; --p-teal: #1d8585; --p-green: #2f8a55; --p-amber: #b47a17; --p-orange: #c8602a; --p-red: #c2463b; --p-violet: #7a4fc4;
  --note-bg: #fbf4d2; --note-stroke: #b59d42;
  --danger: #b8392e;
  --ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14191b; --panel: #1a2023; --ink: #e2e9ea; --ink-2: #9aa9ad; --ink-3: #6c7b80;
    --line: #2c353a; --accent: #7397ff; --accent-soft: rgba(115, 151, 255, .16); --port: #ff8b4f;
    --edge: #c4cfd2; --node-bg: #1f272a; --node-stroke: #b9c5c8; --group-bg: rgba(255, 255, 255, .03);
    --group-stroke: #4b5a5f; --grid-dot: #2a3337;
    --p-slate: #9aabb2; --p-blue: #7f9ef0; --p-teal: #5cc6c6; --p-green: #5cc08a; --p-amber: #e0aa4d; --p-orange: #f0905c; --p-red: #ee7b70; --p-violet: #b195f0; --danger: #ff7d70;
    --note-bg: #353120; --note-stroke: #a08e4c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14191b; --panel: #1a2023; --ink: #e2e9ea; --ink-2: #9aa9ad; --ink-3: #6c7b80;
  --line: #2c353a; --accent: #7397ff; --accent-soft: rgba(115, 151, 255, .16); --port: #ff8b4f;
  --edge: #c4cfd2; --node-bg: #1f272a; --node-stroke: #b9c5c8; --group-bg: rgba(255, 255, 255, .03);
  --group-stroke: #4b5a5f; --grid-dot: #2a3337;
  --p-slate: #9aabb2; --p-blue: #7f9ef0; --p-teal: #5cc6c6; --p-green: #5cc08a; --p-amber: #e0aa4d; --p-orange: #f0905c; --p-red: #ee7b70; --p-violet: #b195f0; --danger: #ff7d70;
  --note-bg: #353120; --note-stroke: #a08e4c;
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- top bar ---------- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand svg { width: 26px; height: 26px; }
.brand .tag { font: 500 11px var(--mono); color: var(--ink-3); letter-spacing: .02em; font-weight: 400; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 5px 11px; font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--danger); }
.sep { width: 1px; background: var(--line); margin: 2px 4px; }
.modes { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.modes > span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 600; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; background: var(--paper); flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; border-radius: 5px; padding: 4px 10px;
  font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.06); }
.modes .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: none; }

/* ---------- main ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
.work { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }

/* ---------- tabs (along the bottom of the canvas) ---------- */
.tabs { position: relative; display: flex; align-items: stretch; gap: 2px; padding: 0 8px; background: var(--panel); border-top: 1px solid var(--line); min-width: 0; }
.tablist { display: flex; gap: 2px; overflow-x: auto; min-width: 0; scrollbar-width: thin; }
.tab {
  display: flex; align-items: center; gap: 6px; border: 0; border-top: 2px solid transparent; background: transparent; padding: 6px 10px 7px;
  font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; white-space: nowrap; max-width: 220px; user-select: none; touch-action: none;
}
.tab:hover { color: var(--ink); background: var(--paper); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--paper); border-top-color: var(--accent); }
.tab .tname { overflow: hidden; text-overflow: ellipsis; }
.tab svg { width: 14px; height: 12px; flex: none; opacity: .7; }
.tab .tx { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; color: var(--ink-3); }
.tab .tx:hover { background: var(--line); color: var(--ink); }
.tab .tx svg { width: 9px; height: 9px; opacity: 1; }
.tab.dragging { opacity: .5; }
.tabs input.tname { font: 500 13px var(--ui); color: var(--ink); background: var(--panel); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; width: 14ch; outline: none; }
.tabs .menu-wrap { display: flex; }
.tabadd { border: 0; background: transparent; color: var(--ink-2); padding: 0 10px; cursor: pointer; display: grid; place-items: center; }
.tabadd:hover { color: var(--accent); background: var(--paper); }
.tabadd svg { width: 12px; height: 12px; }
.tabs .menu { top: auto; bottom: calc(100% + 4px); }
.tab-drop { position: absolute; top: 4px; bottom: 4px; width: 2px; background: var(--accent); pointer-events: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
#cv.panning { cursor: grabbing; }

.status {
  position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 180px);
  font: 12px var(--mono); color: var(--ink-2); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px;
  font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; }
.zoom button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; font: 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.zoom button:hover { color: var(--ink); background: var(--paper); }
.zoom #zlbl { min-width: 52px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }

#editor {
  position: absolute; z-index: 5; resize: none; border: 2px solid var(--accent); border-radius: 4px;
  background: var(--node-bg); color: var(--ink); text-align: center; padding: 4px 8px;
  font: 500 13px/1.25 var(--ui); outline: none;
}

/* ---------- inspector ---------- */
.panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.panel section { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.panel h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.panel p { margin: 0; }
.desc { color: var(--ink-2); font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-2); }
.field > span { font-weight: 500; }
.field textarea, .field select, .num input {
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 6px 8px; font-size: 13px; color: var(--ink); width: 100%;
}
.field textarea { resize: vertical; min-height: 54px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.num { display: flex; flex-direction: column; gap: 3px; font: 11px var(--mono); color: var(--ink-3); }
.num input { font: 12px var(--mono); padding: 5px 6px; font-variant-numeric: tabular-nums; }
.num input:disabled { opacity: .5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatches { display: flex; gap: 5px; flex-wrap: wrap; }
.sw { width: 24px; height: 22px; border-radius: 5px; cursor: pointer; border: 1.5px solid var(--swl); background: var(--swf); padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.palrow { display: flex; flex-direction: column; gap: 5px; }
.palname { font-size: 11.5px; font-weight: 500; color: var(--ink-2); overflow-wrap: anywhere; }
.sw.add { border: 1.5px dashed var(--ink-3); background: transparent; color: var(--ink-2); font: 600 15px/1 var(--ui); }
.sw.add:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.sw.add:disabled { opacity: .4; cursor: default; }
.colorrow { display: grid; grid-template-columns: 34px minmax(0, 1.7fr) repeat(3, minmax(0, 1fr)); gap: 6px; align-items: end; }
.colorrow input[type=color] { width: 34px; height: 29px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); cursor: pointer; }
.colorrow .num input { text-transform: uppercase; padding-inline: 5px; -moz-appearance: textfield; appearance: textfield; }
.colorrow .num input::-webkit-inner-spin-button, .colorrow .num input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.meta { font: 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ports { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.ports div { border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; text-align: center; font: 11px var(--mono); color: var(--ink-3); }
.ports b { display: block; font: 600 15px var(--mono); color: var(--ink); }
.ports .hot b { color: var(--port); }
ol.try { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--ink); }
ol.try li::marker { color: var(--ink-3); font: 12px var(--mono); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; }
input[type=range] { accent-color: var(--accent); width: 100%; }
dl.keys { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px; }
dl.keys dt { font: 11.5px var(--mono); color: var(--ink-2); white-space: nowrap; }
dl.keys dd { margin: 0; }
.ends { font-size: 13px; }
.ends b { font-weight: 600; }
.mode-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); }
.mode-card strong { font-size: 14px; }
.arr { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 8px 10px; align-items: center; }
.arr > .k { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.arr .row { gap: 6px; }
.arr .btn { padding: 5px 9px; }
.arr .num { flex-direction: row; align-items: center; gap: 4px; }
.arr .num input { width: 58px; }
.icons { display: flex; gap: 4px; flex-wrap: wrap; }
.ib { width: 34px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; color: var(--ink); padding: 0; }
.ib:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.ib:disabled { opacity: .4; cursor: default; }
.ib svg { width: 20px; height: 16px; }
.ib .gd, .gicon .gd { stroke: var(--port); stroke-width: 1.4; }
.ib .br, .gicon .br { fill: none; stroke: currentColor; stroke-width: 1.3; }

/* ---------- canvas (SVG) ---------- */
.gdot { fill: var(--grid-dot); }
/* Each shape/connector may set --ln (line), --fl (fill) and --dash on its group; otherwise theme defaults apply. */
.b-body { fill: var(--fl, var(--node-bg)); stroke: var(--ln, var(--node-stroke)); stroke-dasharray: var(--dash, none); stroke-width: 1.5; }
.node { cursor: move; }
.node.sel .b-body, .node.sel .g-body { stroke: var(--accent); stroke-width: 2; }
.node.target .b-body, .node.target .g-body { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); }
.node.lifted { filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); }
.g-body { fill: var(--fl, var(--group-bg)); stroke: var(--ln, var(--group-stroke)); stroke-dasharray: var(--dash, none); stroke-width: 1.25; }
.g-rule { stroke: var(--ln, var(--group-stroke)); stroke-width: 1; opacity: .55; }
.group.drop .g-body { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; fill: var(--accent-soft); }
.g-label { font: 600 11.5px var(--ui); fill: var(--ink-2); letter-spacing: .07em; text-transform: uppercase; }
.g-meta { font: 10px var(--mono); fill: var(--ink-3); }
.lblwrap { pointer-events: none; overflow: visible; }
.lbl {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
  font: 500 13px/1.25 var(--ui); color: var(--ink); padding: 4px 8px; white-space: pre-wrap; overflow: hidden; word-break: break-word;
}
.edge { cursor: pointer; }
.edge .hit { fill: none; stroke: transparent; stroke-width: 12; }
.edge .line { fill: none; stroke: var(--ln, var(--edge)); stroke-dasharray: var(--dash, none); stroke-width: 1.5; stroke-linejoin: round; }
.edge:hover .line { stroke: var(--accent); }
.edge.sel .line { stroke: var(--accent); stroke-width: 2; }
.edge.ghosted { opacity: .25; }
.elabel-bg { fill: var(--paper); }
.elabel-t { font: 500 12px var(--ui); fill: var(--ink-2); text-anchor: middle; dominant-baseline: central; }
.edge.sel .elabel-t, .edge:hover .elabel-t { fill: var(--accent); }
.ahead { fill: var(--edge); }
.ahead.sel { fill: var(--accent); }
.slot { fill: var(--port); }
.slot-x { stroke: var(--port); stroke-width: 1.6; fill: none; }
.rh { fill: var(--panel); stroke: var(--accent); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.conn circle { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: crosshair; }
.conn:hover circle { fill: var(--accent); }
.conn path { stroke: var(--accent); stroke-width: 1.4; vector-effect: non-scaling-stroke; pointer-events: none; fill: none; }
.conn:hover path { stroke: var(--panel); }
.eh { fill: var(--accent); stroke: var(--panel); stroke-width: 2; vector-effect: non-scaling-stroke; cursor: grab; }
.marquee { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.node.primary .b-body, .node.primary .g-body { stroke-width: 3; }
.side-hl { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.drop-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
.temp { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.cur-nw, .cur-se { cursor: nwse-resize; } .cur-ne, .cur-sw { cursor: nesw-resize; }
.cur-n, .cur-s { cursor: ns-resize; } .cur-e, .cur-w { cursor: ew-resize; }
/* Sequence diagrams: participant heads reuse .b-body; lifelines, messages and notes take --ln, --fl and --dash the same way. */
.part { cursor: grab; }
.part.sel .b-body, .part.sel .b-line { stroke: var(--accent); stroke-width: 2; }
.b-line { fill: none; stroke: var(--ln, var(--node-stroke)); stroke-dasharray: var(--dash, none); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.s-headhit { fill: transparent; stroke: none; }
.g-rule { stroke: var(--ln, var(--group-stroke)); stroke-opacity: .55; }
.s-grouphit { fill: transparent; stroke: none; cursor: grab; }
.s-gedge { fill: transparent; stroke: none; cursor: ew-resize; }
.float { pointer-events: none; opacity: .9; }
.g-stretch { fill: var(--accent-soft); fill-opacity: .5; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.sgroup.drop-in .g-body { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); }
.sgroup.drop-out .g-body { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
.part.join .b-body, .part.join .b-line { stroke: var(--accent); stroke-width: 2.5; }
.part.leave { opacity: .45; }
.sgroup.sel .g-body { stroke: var(--accent); stroke-width: 2; }
.sgroup.sel .g-label { fill: var(--accent); }
.s-name { font: 500 13px var(--ui); fill: var(--ink); pointer-events: none; }
.s-life { stroke: var(--ln, var(--group-stroke)); stroke-width: 1.25; stroke-dasharray: 5 4; }
.s-life.sel { stroke: var(--accent); }
.s-life.pick { stroke: var(--accent); stroke-width: 2; }
.s-life.hot { stroke: var(--accent); stroke-width: 3; stroke-dasharray: none; }
.s-lifehit { fill: transparent; cursor: crosshair; }
.msg { cursor: pointer; }
.msg .hit { fill: none; stroke: transparent; stroke-width: 12; }
.msg .s-line { fill: none; stroke: var(--ln, var(--edge)); stroke-width: 1.5; stroke-dasharray: var(--dash, none); stroke-linejoin: round; }
.msg .s-fill { fill: var(--ln, var(--edge)); }
.msg .s-open { fill: none; stroke: var(--ln, var(--edge)); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.msg:hover .s-line, .msg.sel .s-line, .msg:hover .s-open, .msg.sel .s-open { stroke: var(--accent); }
.msg:hover .s-fill, .msg.sel .s-fill { fill: var(--accent); }
.msg.sel .s-line { stroke-width: 2; }
.s-label { font: 500 12px var(--ui); fill: var(--ink); }
.s-label-bg { fill: var(--paper); }
.msg:hover .s-label, .msg.sel .s-label { fill: var(--accent); }
.note { cursor: pointer; }
.n-body { fill: var(--fl, var(--note-bg)); stroke: var(--ln, var(--note-stroke)); stroke-width: 1.25; stroke-dasharray: var(--dash, none); stroke-linejoin: round; }
.n-fold { fill: none; stroke: var(--ln, var(--note-stroke)); stroke-width: 1.25; stroke-linejoin: round; }
.note.sel .n-body, .note.sel .n-fold { stroke: var(--accent); stroke-width: 2; }
.n-text { font: 500 12px var(--ui); fill: var(--ink); pointer-events: none; }
.s-act { fill: var(--fl, var(--node-bg)); stroke: var(--ln, var(--node-stroke)); stroke-width: 1.25; pointer-events: none; }
.frame, .fsec, .fend { cursor: row-resize; }
.frame .hit, .fsec .hit, .fend .hit { fill: none; stroke: transparent; stroke-width: 12; }
.f-box { fill: none; stroke: var(--ink-2); stroke-width: 1.25; pointer-events: none; }
.f-tab { fill: var(--paper); stroke: var(--ink-2); stroke-width: 1.25; stroke-linejoin: round; cursor: pointer; }
.f-kind { font: 700 11px var(--ui); fill: var(--ink); pointer-events: none; }
.f-guard { font: 500 12px var(--ui); fill: var(--ink); cursor: pointer; }
.f-else { fill: none; stroke: var(--ink-2); stroke-width: 1.25; stroke-dasharray: 6 4; }

<script>
'use strict';
/* =====================================================================
   Core model: pure functions over state S (no DOM). Testable headless.
   ===================================================================== */
const HEADER = 30, STUB = 20, MIN_GAP = 12, MIN_W = 40, MIN_H = 30;
const MAX_POS = 1e6, MAX_SIZE = 1e5, MAX_PAD = 1000;   // bounds on positions, sizes, and container padding and gaps
// The most a box diagram holds, and the longest text: enough for any real diagram, small enough that a crafted file
// can't make every redraw take seconds (owner's choice, build 42). Files are cut to these; editing stops at them.
const MAX_NODES = 1000, MAX_EDGES = 500, MAX_TEXT = 5000;
const SIDES = ['top', 'right', 'bottom', 'left'];
const NORMAL = { top: { x: 0, y: -1 }, right: { x: 1, y: 0 }, bottom: { x: 0, y: 1 }, left: { x: -1, y: 0 } };
const KEY = 'snapblade-playground-v1', OLD_KEY = 'diogramo-playground-v1', META_KEY = 'snapblade-doc-meta', AUTHOR_KEY = 'snapblade-author', ASIDE_KEY = 'snapblade-set-aside-v1';
const PAL_KEY = 'snapblade-palettes';   // saved palettes, shared by every diagram in this browser
let doc = { name: 'Untitled diagram', dirty: false };   // the diagram's name, and whether it has unsaved file changes

let S = null;          // { nodes, edges, settings, title, legend }: the diagram on the open tab (a sequence diagram adds type, parts and rows)
let BOOK = null;       // the file's tabs: { pages: [{ name, S, undo, redo, view }], active }; S is always pages[active].S
let lifted = null;     // node being dragged: excluded from its container's layout
let uid = Date.now() % 1e6;
// A new id that nothing in the diagram uses yet (ids from an opened file can sit in the same range).
function nid(p) {
  let id;
  const taken = o => o.id === id;
  do id = p + (++uid).toString(36); while (S.nodes.some(taken) || S.edges.some(taken) || S.parts?.some(taken) || S.rows?.some(taken));
  return id;
}
// A lookup keyed by ids. Ids come from files, so it has no inherited names ("constructor", "__proto__") to collide with.
const dict = () => Object.create(null);

const byId = id => S.nodes.find(n => n.id === id);
const kidsOf = id => S.nodes.filter(n => n.parent === id && n.id !== lifted);
function subtree(id) {
  const out = [id];
  for (let i = 0; i < out.length; i++) for (const n of S.nodes) if (n.parent === out[i]) out.push(n.id);
  return out;
}
function translate(id, dx, dy) {
  if (!dx && !dy) return;
  for (const sid of subtree(id)) { const n = byId(sid); n.x += dx; n.y += dy; }
}
function depth(n) { let d = 0, p = n.parent; while (p) { d++; p = byId(p)?.parent; } return d; }
const center = n => ({ x: n.x + n.w / 2, y: n.y + n.h / 2 });
const axisOf = side => (side === 'left' || side === 'right') ? 'y' : 'x';
const sideSpan = (n, side) => axisOf(side) === 'y' ? [n.y, n.y + n.h] : [n.x, n.x + n.w];
function pointOn(n, side, t) {
  if (side === 'top') return { x: t, y: n.y };
  if (side === 'bottom') return { x: t, y: n.y + n.h };
  if (side === 'left') return { x: n.x, y: t };
  return { x: n.x + n.w, y: t };
}

function sample() {
  const B = (id, label, x, y, w, h, o = {}) => ({ id, kind: 'box', label, x, y, w, h, parent: null, ...o });
  const G = (id, label, x, y, w, h, o = {}) => ({ id, kind: 'group', label, x, y, w, h, parent: null, layout: 'free', align: 'center', pad: 20, gap: 30, ...o });
  const E = (id, a, b, sa = 'auto', sb = 'auto') => ({ id, from: { node: a, side: sa }, to: { node: b, side: sb }, arrow: 'end' });
  return {
    nodes: [
      B('users', 'Customers', 40, 195, 120, 60, { style: { line: 'blue' } }),
      G('edge', 'Edge', 220, 150, 180, 270, { layout: 'column' }),
      B('waf', 'Web app firewall', 0, 0, 140, 50, { parent: 'edge' }),
      B('lb', 'Load balancer', 0, 0, 140, 120, { parent: 'edge' }),
      G('app', 'Application tier', 500, 90, 200, 470),
      B('orders', 'Orders API', 520, 140, 160, 60, { parent: 'app' }),
      B('inv', 'Inventory API', 520, 310, 160, 60, { parent: 'app' }),
      B('pay', 'Payments API', 520, 480, 160, 60, { parent: 'app' }),
      G('data', 'Data tier', 800, 90, 200, 300, { layout: 'column', gap: 20 }),
      B('odb', 'Orders DB', 0, 0, 160, 50, { parent: 'data', style: { line: 'green' } }),
      B('cache', 'Redis cache', 0, 0, 160, 90, { parent: 'data', style: { line: 'amber' } }),
      B('idb', 'Inventory DB', 0, 0, 160, 50, { parent: 'data', style: { line: 'green' } }),
      B('gw', 'Payment gateway\n(external)', 820, 480, 160, 60, { style: { dash: 'dashed', fill: 'none' } }),
    ],
    edges: [
      { ...E('e1', 'users', 'waf'), label: 'HTTPS' }, E('e2', 'waf', 'lb'),
      { ...E('e3', 'lb', 'orders'), label: '/orders' }, { ...E('e4', 'lb', 'inv'), label: '/stock' }, { ...E('e5', 'lb', 'pay'), label: '/pay' },
      { ...E('e6', 'orders', 'odb'), label: 'SQL' }, E('e7', 'orders', 'cache'),
      E('e8', 'inv', 'cache'), { ...E('e9', 'inv', 'idb'), label: 'SQL' },
      { ...E('e10', 'pay', 'gw'), label: 'REST\nmTLS', style: { dash: 'dashed' } },
    ],
    settings: { mode: 'straighten', grid: 10, showSlots: true, routing: 'ortho', radius: 6, labelPos: 'start', walls: true, autonumber: false, footbox: true, activation: true },
    title: { ...titleDefaults(), show: true, title: 'Order platform', version: '0.3', date: todayIso() },
    legend: { ...legendDefaults(), show: true, labels: {
      'box:blue||pair': 'People and client apps', 'box:green||pair': 'Database', 'box:amber||pair': 'Cache',
      'box:|dashed|none': 'Third-party service', 'connector:|dashed': 'Leaves our network' } },
  };
}

/* ---------- colors and line styles ----------
   style.line: null (theme default) | preset name (adapts to light/dark) | '#rrggbb'
   style.fill: 'pair' (a tint of the line color, the default) | 'none' | '#rrggbb'
   style.tint: strength of the paired tint in %; style.dash: 'solid' | 'dashed' | 'dotted' */
const PRESETS = ['slate', 'blue', 'teal', 'green', 'amber', 'orange', 'red', 'violet'];
const DASH = { solid: 'none', dashed: '6 4', dotted: '1.5 3.5' };
const isHex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
const lineCss = (v, fallback) => !v ? fallback : isHex(v) ? v : `var(--p-${v})`;
const defLineCss = o => !o.kind ? 'var(--edge)' : o.kind === 'group' ? 'var(--group-stroke)' : o.kind === 'note' ? 'var(--note-stroke)' : 'var(--node-stroke)';
const tintOf = o => o.style?.tint ?? (o.kind === 'group' ? 7 : 16);
function styleVars(o) {
  const st = o.style || {}, out = [];

## Laying it out well

- Flow left to right in tiers (for example clients, edge, services, data, external), one column per tier. Top to bottom is fine when that reads better.
- Line shapes up so connectors run straight. A connector is straight when the two sides it joins face each other and overlap: Snapblade slides the anchors on the less busy side to line up with the other. So give connected shapes overlapping spans (the same center line is best), and make a box with many connectors on one side tall enough that its partners all face it.
- One diagram can mix directions: a request path left to right with an event fan-out below it is fine.
- Boxes are usually 140 to 160 wide and 50 to 60 tall. Make a box taller (90 to 120) when many connectors meet one of its sides.
- Keep at least ${WALL} px between any two shapes in the same container or on the canvas. Leave 80 to 140 px between columns so connectors have room for bends and labels, and 30 to 60 px between shapes in a column.
- Use \`"column"\` (or \`"row"\`) containers for tiers: you only place the container and Snapblade stacks what's inside. Use a \`"free"\` container when its children need their own positions: place them inside it, at least \`pad\` from its edges and below its header, and make the container big enough to hold them.
- List containers before the shapes inside them, and list a row's or column's children in the order they should appear.
- Keep ids short and readable (\`orders-api\`). Keep labels short: a box says what it is; a connector says what flows (\`HTTPS\`, \`SQL\`, \`/orders\`).

## Checklist

- Valid JSON. Every id unique. Every \`from.node\`, \`to.node\` and \`parent\` names an existing shape, and every \`parent\` is a \`"group"\`.
- No two shapes overlap or sit closer than ${WALL} px, except a container and the shapes inside it. Opening a file never moves anything, so this is up to you.
- In a sequence diagram: every \`from\`, \`to\` and note \`on\` names a participant in \`parts\`, ids are unique across participants and rows, each reply comes right after its call, and every frame start has its end below it.
- With tabs: version 2, a \`pages\` list, and each page's \`diagram\` follows the rules above.
- Only the fields and values described here.

## Sequence diagrams

A sequence diagram is a different kind of file: participants left to right, and rows (messages, notes and frames) top to bottom. Nothing in it has a position. Snapblade makes each column as wide as the labels next to it need and spaces the rows evenly, so you only decide the order.

    {"format": "snapblade", "version": 1, "diagram": {"type": "sequence", "parts": [...], "rows": [...], "settings": {...}, "title": {...}, "legend": {...}}}

- \`type\` (required): \`"sequence"\`. Leave out \`nodes\` and \`edges\`; a sequence diagram doesn't use them.
- \`parts\`: the participants, in order from left to right, at most ${MAX_PARTS}: \`{"id": "orders", "kind": "participant", "label": "Orders API"}\`. \`id\` follows the shape id rules, \`label\` is the text (\`\\n\` for a second line), \`kind\` may be left out, and \`style\` works as for boxes. \`head\` is the head's shape, ${or(valuesOf(HEADS).map(q))}: an actor is a stick figure with the name under it, a database a cylinder, a queue a cylinder on its side. Leave it out for a box, the default.
- \`rows\`: messages, notes and frame lines in the order things happen, at most ${MAX_ROWS}. Ids are unique across participants and rows.
- A message: \`{"id": "m1", "from": "cust", "to": "web", "type": "sync", "label": "Place order"}\`. \`from\` and \`to\` are participant ids, the same one for a self-message; a message naming a participant that doesn't exist is dropped. \`type\` is ${or(valuesOf(MSG_TYPES).map(q))}: a call that waits for an answer (filled arrowhead), one that doesn't wait (open arrowhead), or the answer (dashed). Default \`"sync"\`. \`style\`: \`line\` and \`dash\` only; a reply is dashed unless \`dash\` says otherwise.
- A note: \`{"id": "n1", "kind": "note", "side": "right", "on": ["gw"], "label": "Can take up to 5 s"}\`. \`side\` is ${or(valuesOf(NOTE_SIDES).map(q))}. \`on\` lists the participant it sits beside, or for \`"over"\` one or two participants (the note spans from one to the other). A note takes a row of its own. \`style\` works as for boxes.
- A frame (alt, opt, loop, par) is rows around the rows it holds: a start \`{"id": "f1", "kind": "frame", "type": "alt", "label": "approved"}\`, then the rows, then an end \`{"id": "f1x", "kind": "end"}\`. For an alt or par, an else line \`{"id": "f1e", "kind": "else", "label": "declined"}\` between them starts the next section. \`type\` is ${or(valuesOf(FRAME_TYPES).map(q))}: ${FRAME_TYPES.map(([v]) => FRAME_HINTS[v]).join(', ')}. Default ${q('alt')}. \`label\` is the condition, shown in brackets (leave the brackets out). Frames nest, at most ${MAX_DEPTH} deep. An end with no start, or an else line outside an alt or par, is dropped; a start with no end is closed after the last row. A frame is drawn as wide as the lifelines its rows touch.
- A divider \`{"id": "d1", "kind": "divider", "label": "Fulfilment"}\` is a row that marks a new phase: a double line across the whole diagram with the label in the middle. A delay \`{"id": "d2", "kind": "delay", "label": "5 minutes later"}\` is a row that shows time passing: the lifelines go dotted for a stretch. \`kind\` is ${or(valuesOf(BREAKS).map(q))}; \`label\` may be empty. Either can sit inside a frame.
- \`groups\` (optional): boxes around neighbouring participants, like PlantUML's \`box ... end box\`: \`{"id": "platform", "kind": "group", "label": "Our platform", "parts": ["web", "orders", "pay"]}\`. \`parts\` lists participant ids that sit side by side in \`parts\` order; a participant is in one group at most, and groups don't nest. \`style\` works as for containers. The ids share the namespace with participants and rows.
- \`settings.autonumber\` numbers the messages, \`settings.footbox\` repeats the participants at the bottom, and \`settings.activation\` (default \`true\`) draws activation bars. Bars are automatic: a sync call starts one on the participant it calls, and a reply back closes the latest open call between the two (in an alt, each section's reply counts and the bar runs to the last). A call with no reply lasts to that participant's last message before the caller sends again. A caller with no bar of its own gets one for as long as it waits. Async messages start none. So send a reply for every call you want to read as finished. The other settings don't apply. The title block and legend work as above.
- Put each reply right after the call it answers. Keep labels short: an operation, an endpoint or an event name.

## Several diagrams in one file (tabs)

A file can hold several diagrams, each shown as a tab: for example an architecture diagram and the sequence diagrams that go with it. Use version 2 and a \`pages\` list instead of \`diagram\`:

    {"format": "snapblade", "version": 2, "active": 0, "pages": [{"name": "Architecture", "diagram": {...}}, {"name": "Checkout", "diagram": {"type": "sequence", ...}}]}

- \`active\`: the index of the tab the file opens at. Default 0.

  const said = left.length ? [`left out ${left.join(', ')}`] : [];
  if (overLimit.text) said.push(`shortened ${words(overLimit.text, 'text')} to ${n(MAX_TEXT)} characters`);
  return said.join(', and ');
}
async function openFile() {
  if (!(await confirmDiscard())) return;
  if (canPickFiles()) {
    try {
      const [h] = await window.showOpenFilePicker({ types: FILE_TYPES, excludeAcceptAllOption: false });
      const f = await h.getFile();
      loadDiagram(await f.text(), f.name, h);
      return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  document.getElementById('fileInput').click();
}
// A new file with one empty tab.
async function newDiagram(type) {
  if (!(await confirmDiscard())) return;
  const d = emptyDiagram(type);
  openBook({ pages: [{ name: pageName(d, 0), diagram: d }], active: 0 });
  fileHandle = null; doc = { name: isSeq() ? 'Untitled sequence diagram' : 'Untitled diagram', dirty: false };
  sel = null; multi = []; seqNext = null; view = startView();
  syncTypeUi(); renderTabs(); refresh(true, false); save(false); updateDocUi();
}
// Put a sample back (undoable). The "Things to try" steps in Help refer to them.
function loadSample(seq) {
  pushUndo(); const s = seq ? seqSample() : sample(); setContent(s);
  if (!seq) S.settings.mode = s.settings.mode;
  sel = null; multi = []; seqNext = null; syncTypeUi(); syncModeButtons(); layoutAll(false); refresh(true, true); fit();
}
// Before replacing the diagram: if it has changes not saved to a file, ask first.
async function confirmDiscard() {
  if (!doc.dirty || (BOOK.pages.length < 2 && !hasContent())) return true;
  const choice = await ask(`
    <h2 id="modalTitle">Save changes to “${esc(doc.name)}”?</h2>
    <p>Your work is kept in this browser, but these changes haven't been saved to a file.</p>
    <div class="actions">
      <button class="btn" type="button" data-choice="cancel">Cancel</button>
      <button class="btn" type="button" data-choice="discard">Don't save</button>
      <button class="btn primary" type="button" data-choice="save">Save</button>
    </div>`, 'small');
  if (choice === 'save') return saveFile(false);
  return choice === 'discard';
}

/* ---------- dialogs and toasts ---------- */
let modalResolve = null;
// Show a dialog; resolves with the data-choice of the button pressed ('cancel' on Esc or backdrop).
function ask(html, size = '', onOpen) {
  const back = document.getElementById('modal'), box = back.firstElementChild;
  box.className = 'modal ' + size; box.innerHTML = html; back.hidden = false;
  closeMenu();
  return new Promise(res => {
    modalResolve = res;
    onOpen?.(box);
    if (!box.contains(document.activeElement)) (box.querySelector('.primary') || box.querySelector('button'))?.focus();
  });
}
function closeModal(choice) {
  const back = document.getElementById('modal');
  if (back.hidden) return;
  back.hidden = true; back.firstElementChild.innerHTML = '';
  const r = modalResolve; modalResolve = null; r?.(choice);
}
let toastTimer = null;
function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('err', isError); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, isError ? 5000 : 2400);
}

    const dy = Math.max(-100, Math.min(100, ev.deltaY * unit));
    zoomAt(Math.exp(-dy * (ev.ctrlKey ? 0.01 : 0.0025)), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });

  editor.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commitEditor(false, true); }
    if (ev.key === 'Escape') { ev.preventDefault(); commitEditor(true); }
  });
  editor.addEventListener('blur', () => commitEditor());

  panel.addEventListener('input', ev => onField(ev.target));
  panel.addEventListener('focusout', () => { fieldUndo = false; });
  panel.addEventListener('click', ev => { const b = ev.target.closest('[data-act]'); if (b) onAct(b); });

  document.querySelectorAll('#modeSeg button').forEach(b => { b.title = MODES[b.dataset.mode][1]; });
  document.getElementById('helpBtn').addEventListener('click', () => openHelp());
  document.getElementById('modeSeg').addEventListener('click', ev => { const b = ev.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });
  document.getElementById('addBox').addEventListener('click', () => addNode('box'));
  document.getElementById('addGroup').addEventListener('click', () => addNode('group'));
  document.getElementById('addPart').addEventListener('click', () => addPart());
  document.getElementById('addNote').addEventListener('click', addSeqNote);
  const frameMenu = document.getElementById('frameMenu');
  frameMenu.innerHTML = FRAME_TYPES.map(([v, l]) => `<button type="button" role="menuitem" data-frame="${v}">${l}<kbd>${FRAME_HINTS[v]}</kbd></button>`).join('');
  document.getElementById('addFrame').addEventListener('click', ev => {
    ev.stopPropagation();
    const open = frameMenu.hidden;
    closeMenu(); frameMenu.hidden = !open; ev.currentTarget.setAttribute('aria-expanded', String(open));
    if (open) frameMenu.querySelector('button').focus();
  });
  frameMenu.addEventListener('click', ev => { const b = ev.target.closest('[data-frame]'); if (b) addFrame(b.dataset.frame); });
  const breakMenu = document.getElementById('breakMenu');
  breakMenu.innerHTML = BREAKS.map(([v, l]) => `<button type="button" role="menuitem" data-break="${v}">${l}<kbd>${BREAK_HINTS[v]}</kbd></button>`).join('');
  document.getElementById('addBreak').addEventListener('click', ev => {
    ev.stopPropagation();
    const open = breakMenu.hidden;
    closeMenu(); breakMenu.hidden = !open; ev.currentTarget.setAttribute('aria-expanded', String(open));
    if (open) breakMenu.querySelector('button').focus();
  });
  breakMenu.addEventListener('click', ev => { const b = ev.target.closest('[data-break]'); if (b) addBreak(b.dataset.break); });
  document.getElementById('undoBtn').addEventListener('click', () => restore(undoStack, redoStack));
  document.getElementById('redoBtn').addEventListener('click', () => restore(redoStack, undoStack));
  document.getElementById('fitBtn').addEventListener('click', fit);
  const zc = f => { const r = svg.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); };
  document.getElementById('zin').addEventListener('click', () => zc(1.2));
  document.getElementById('zout').addEventListener('click', () => zc(1 / 1.2));
  document.getElementById('zlbl').addEventListener('click', () => zc(1 / view.k));

  window.addEventListener('keydown', ev => {
    const mod = ev.ctrlKey || ev.metaKey, k = ev.key;
    if (k === 'Alt' && drag) ev.preventDefault();   // Alt+drag ignores walls; keep the browser from opening its menu
    if (!document.getElementById('modal').hidden) { if (k === 'Escape') { ev.preventDefault(); closeModal('cancel'); } return; }
    if (k === 'Escape' && !document.getElementById('fileMenu').hidden) { closeMenu(); document.getElementById('fileBtn').focus(); return; }
    if (k === 'Escape' && drag && isSeq()) { ev.preventDefault(); drag = null; svg.classList.remove('panning'); render(); return; }   // cancel a drag; the preview goes
    if (mod && k.toLowerCase() === 's') { ev.preventDefault(); if (document.activeElement === editor) commitEditor(); saveFile(ev.shiftKey); return; }
    if (mod && k.toLowerCase() === 'o') { ev.preventDefault(); openFile(); return; }
    if (k === 'F1') { ev.preventDefault(); if (document.activeElement === editor) commitEditor(); openHelp(); return; }
    if (ev.target.matches?.('input, textarea, select')) return;
    if (mod && k.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? restore(redoStack, undoStack) : restore(undoStack, redoStack); }
    else if (mod && k.toLowerCase() === 'y') { ev.preventDefault(); restore(redoStack, undoStack); }
    else if (mod && ev.shiftKey && k.toLowerCase() === 'c') { ev.preventDefault(); copyStyle(); }
    else if (mod && ev.shiftKey && k.toLowerCase() === 'v') { ev.preventDefault(); pasteStyle(); }
    else if (mod && k.toLowerCase() === 'c') { if (copySel()) ev.preventDefault(); }
    else if (mod && k.toLowerCase() === 'x') { ev.preventDefault(); cutSel(); }
    else if (mod && k.toLowerCase() === 'v') { ev.preventDefault(); paste(); }
    else if (mod && k.toLowerCase() === 'd') { ev.preventDefault(); duplicateSel(); }
    else if (k === '?' && !sel && !mod) { ev.preventDefault(); openHelp(); }
    else if (mod && k.toLowerCase() === 'a') { ev.preventDefault(); setMulti(topLevel(S.nodes.map(n => n.id))); render(); }
    else if (k === 'Delete' || k === 'Backspace') { if (sel) { ev.preventDefault(); deleteSel(); } }
    else if (k === 'Escape') { seqNext = null; select(null); render(); }
    else if ((k === 'F2' || k === 'Enter') && sel) { ev.preventDefault(); startEditing(); }
    else if (sel && sel.type !== 'annot' && k.length === 1 && k !== ' ' && !mod && !ev.altKey) { ev.preventDefault(); startEditing(k); }
    else if (k === ' ') { spaceDown = true; }
    else if (sel?.type === 'seq' && k.startsWith('Arrow')) { ev.preventDefault(); seqNudge(k); }
    else if (sel?.type === 'node' && k.startsWith('Arrow')) {
      ev.preventDefault();
      const s = ev.shiftKey ? 1 : S.settings.grid;
      const dx = k === 'ArrowLeft' ? -s : k === 'ArrowRight' ? s : 0, dy = k === 'ArrowUp' ? -s : k === 'ArrowDown' ? s : 0;
      const ms = topLevel(selectedIds()).map(byId), go = wallOffset(ms, dx, dy);
      pushUndo(); for (const m of ms) translate(m.id, go.x, go.y); refresh(false, true);
    }
  });
  window.addEventListener('keyup', ev => { if (ev.key === ' ') spaceDown = false; if (ev.key === 'Alt' && drag) ev.preventDefault(); });
  new ResizeObserver(() => render()).observe(stage);
  document.fonts?.ready.then(() => render());
}

if (typeof document !== 'undefined' && document.getElementById('cv')) init();
</script>
</body>
</html>
